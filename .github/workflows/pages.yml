name: Publish Elsewhere to GitHub Pages

# Publishing is manual so changes can be previewed before they go live.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check GitHub Pages settings
        uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
